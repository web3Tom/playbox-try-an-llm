site_name: Polestar Playbox — Try an LLM
docs_dir: docs
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.instant
    - navigation.tracking
    - toc.follow

nav:
  - Home: index.md
  - Getting Started:
    - Environment: getting-started/environment.md
    - Agents as Code: getting-started/agents.md
    - Agent Extensions: getting-started/agent-extensions.md
  - Models & Routing: models.md
  - Demos:
    - Codebase Analyzer: demos/codebase-analyzer.md
    - Orchestrator (Planning + Delegation): demos/orchestrator.md
    - GitLab Issue Summarizer: demos/gitlab-agent.md
    - RAG with Embeddings: demos/rag-embeddings.md
    - Audio Transcription: demos/transcription.md
    - React UI Generation: demos/react-ui.md
  - Decisions:
    - "ADR-0001: Output & Context Limits": adr/ADR-0001.md
    - "ADR-0002: Image Attachment & OCR Strategy": adr/ADR-0002.md

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - tables
  - codehilite
  - toc
